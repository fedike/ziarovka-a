<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nájdi začiatočné písmeno</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:"Comic Sans MS","Comic Sans","Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,#FFF9E8 0%,#E8F4FD 100%);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:1.6vmin;padding:1vmin 2vmin;min-height:58px;z-index:5}
h1{margin:0;font-size:clamp(15px,3vmin,28px);color:#4E342E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdrRight{margin-left:auto;display:flex;align-items:center;gap:1.4vmin}
.pill{background:#fff;border:3px solid #B0BEC5;color:#455A64;border-radius:999px;padding:.3vmin 1.6vmin;font-size:clamp(12px,2.4vmin,22px);font-weight:700;white-space:nowrap}
#newBtn{background:#FF8F00;color:#fff;border:none;border-radius:999px;padding:.9vmin 2.2vmin;font-size:clamp(13px,2.6vmin,24px);font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #E65100;white-space:nowrap}
#newBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E65100}
main{flex:1;display:flex;min-height:0;padding:0 1.6vmin}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vmin}
#picCard{background:#fff;border-radius:3vmin;box-shadow:0 1vmin 3vmin rgba(62,39,35,.15);padding:1.4vmin;width:min(46vmin,42vh,470px);aspect-ratio:1/1;flex:0 0 auto}
#pic{width:100%;height:100%}
#pic svg{width:100%;height:100%;display:block}
#zone{width:min(30vmin,26vh,280px);height:clamp(72px,15vh,140px);border:.8vmin dashed #AEBDC7;border-radius:2.4vmin;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;color:#AEBDC7;font-size:clamp(34px,7vmin,64px);font-weight:800;transition:border-color .12s,background .12s,transform .12s}
#zone.near{border-color:#FFB300;background:#FFF6D9;color:#F9A825;transform:scale(1.05)}
#zone.good{border-style:solid;border-color:#43A047;background:#E4F5E7;color:#2E7D32}
#zone.bad{border-style:solid;border-color:#E53935;background:#FDE7E9}
#word{min-height:clamp(30px,6.5vh,58px);display:flex;align-items:center;font-size:clamp(22px,5.6vmin,50px);font-weight:700;color:#37474F;opacity:0;transition:opacity .15s;letter-spacing:.04em;text-align:center}
#word.show{opacity:1}
#word.ok{color:#2E7D32}
#cards{display:flex;justify-content:center;align-items:flex-end;gap:2.6vmin;padding:.8vmin 1vmin 2vmin;z-index:5}
.card{position:relative;width:clamp(72px,14.5vmin,150px);aspect-ratio:4/5;border-radius:2.6vmin;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,9vmin,92px);font-weight:800;cursor:pointer;touch-action:manipulation;box-shadow:0 .8vmin 0 rgba(0,0,0,.18),0 1.4vmin 3vmin rgba(0,0,0,.14);border:none;font-family:inherit;color:#fff;transition:transform .15s;will-change:transform}
.card:active{transform:scale(.96)}
.card.fly{transition:transform .45s cubic-bezier(.25,.8,.35,1.15);z-index:40;box-shadow:0 2vmin 4vmin rgba(0,0,0,.3)}
.card.shake{animation:shk .38s}
.card.gone{visibility:hidden}
.card.badflash{background:#E53935 !important;color:#fff !important;box-shadow:0 .8vmin 0 #B71C1C,0 1.4vmin 3vmin rgba(0,0,0,.2)}
.card-O{background:#F57C00}
.card-S{background:#757575}
.card-B{background:#FFFFFF;color:#263238;box-shadow:0 .8vmin 0 #B7C2C9,0 1.4vmin 3vmin rgba(0,0,0,.14)}
.card-U{background:#36454F}
.card-A{background:#007FFF}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
#side{width:clamp(64px,9vmin,112px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vmin;flex:0 0 auto}
#batt{width:100%;max-height:80vh}
.cell{fill:#ECEFF1;stroke:#9FB1BC;stroke-width:3}
.cell.lit{fill:#FFC107;stroke:#E08900}
.cell.pop{animation:cpop .55s}
@keyframes cpop{40%{transform:scale(1.12)}}
.cell.pop{transform-box:fill-box;transform-origin:center}
.rays{opacity:0;transition:opacity .3s}
#bulbG.bulb-on .bulb-glass{fill:#FFF176}
#bulbG.bulb-on .bulb-core{opacity:.95}
#bulbG.bulb-on .rays{opacity:1}
.wob{animation:wob .13s 7;transform-box:fill-box;transform-origin:center}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(7deg)}70%{transform:rotate(-7deg)}}
#battLbl{font-size:clamp(12px,2.2vmin,18px);font-weight:700;color:#546E7A;white-space:nowrap}
#smiley{position:fixed;top:8px;left:50%;transform:translateX(-50%) scale(0);z-index:60;display:flex;align-items:center;gap:1.2vmin;background:#E7F6EA;border:.5vmin solid #43A047;color:#2E7D32;border-radius:999px;padding:.4vmin 2.2vmin;font-size:clamp(18px,3.6vmin,34px);font-weight:800;box-shadow:0 .6vmin 2vmin rgba(46,125,50,.25);pointer-events:none;white-space:nowrap}
#smiley.on{transition:transform .18s cubic-bezier(.2,1.6,.4,1);transform:translateX(-50%) scale(1)}
#smiley.off{transition:transform .18s ease-in;transform:translateX(-50%) scale(0)}
#smiley svg{width:1.5em;height:1.5em}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}
#overlay{position:fixed;inset:0;background:rgba(55,71,79,.6);display:none;align-items:center;justify-content:center;z-index:70}
#overlay.show{display:flex}
#dialog{background:#FFFDF7;border-radius:4vmin;padding:4vmin 6vmin;text-align:center;box-shadow:0 2vmin 6vmin rgba(0,0,0,.35);max-width:86vw}
#dTitle{margin:0 0 1vmin;font-size:clamp(26px,6vmin,54px);color:#3E2723}
#dText{margin:0 0 3vmin;font-size:clamp(20px,4.4vmin,40px);color:#546E7A;font-weight:700}
#dBtn{background:#43A047;color:#fff;border:none;border-radius:999px;padding:1.6vmin 5vmin;font-size:clamp(22px,4.6vmin,44px);font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 .6vmin 0 #2E7D32}
#dBtn:active{transform:translateY(4px);box-shadow:none}
body.sheet{overflow:auto;display:block;height:auto}
#sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:12px}
.cellart{background:#fff;border-radius:12px;border:2px solid #ddd;padding:6px;text-align:center}
.cellart svg{width:100%;height:auto;display:block}
.cellart b{display:block;font-size:15px;color:#333;margin-top:2px}
@media (max-width:600px){#side{width:56px}#battLbl{font-size:11px}.card{width:clamp(54px,15.5vw,84px)}h1{font-size:14px}.pill{font-size:11px;padding:2px 8px}#newBtn{font-size:12px;padding:6px 10px}}
</style>

function artOf(w){var a=ART[w]||'';return svgArt('<g stroke="#33302B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+a+'</g>')}

/* ============ hra ============ */
var LETTERS=['O','S','B','U','A'];
var ROUNDS=8, PER_ROUND=16;
var els={pic:$('#pic'),zone:$('#zone'),word:$('#word'),cards:$('#cards'),roundLbl:$('#roundLbl'),imgLbl:$('#imgLbl'),battLbl:$('#battLbl'),smiley:$('#smiley'),overlay:$('#overlay'),dTitle:$('#dTitle'),dText:$('#dText'),dBtn:$('#dBtn'),bulbG:$('#bulbG')};
var S={round:1,idx:0,bag:[],last:null,cur:null,locked:false,timer:0,sm:0};

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function refill(){var ws=shuffle(ALL.slice());if(S.last&&ws.length>1&&ws[0].w===S.last){var i=1+Math.floor(Math.random()*(ws.length-1));var t=ws[0];ws[0]=ws[i];ws[i]=t}S.bag=ws}
function nextWord(){if(!S.bag.length)refill();var it=S.bag.shift();S.last=it.w;return it}

function buildCards(){els.cards.innerHTML='';LETTERS.forEach(function(L){var b=document.createElement('button');b.type='button';b.className='card card-'+L;b.dataset.letter=L;b.textContent=L;b.setAttribute('aria-label','Písmeno '+L);els.cards.appendChild(b)})}
function setZone(cls,txt){els.zone.className='';if(cls)els.zone.classList.add(cls);els.zone.textContent=txt}
function updateLbls(){els.roundLbl.textContent='Kolo '+S.round+'/'+ROUNDS;els.imgLbl.textContent='Obrázok '+(S.idx+1)+'/'+PER_ROUND;els.battLbl.textContent=(S.round-1)+'/'+ROUNDS}

function showQuestion(){S.cur=nextWord();S.locked=false;els.pic.innerHTML=artOf(S.cur.w);els.word.textContent='';els.word.className='';buildCards();setZone('','?');updateLbls()}

/* dotyk: kartička sama odletí na určené miesto pod obrázkom */
function playCard(card){
 if(S.locked||card.classList.contains('gone'))return;
 S.locked=true;
 var cr=card.getBoundingClientRect(),zr=els.zone.getBoundingClientRect();
 var dx=zr.left+zr.width/2-(cr.left+cr.width/2),dy=zr.top+zr.height/2-(cr.top+cr.height/2);
 card.classList.add('fly');
 card.style.transform='translate('+dx+'px,'+dy+'px) scale(1.08)';
 setTimeout(function(){evaluate(card)},480);
}
els.cards.addEventListener('contextmenu',function(e){e.preventDefault()});
els.cards.addEventListener('click',function(e){
 var card=e.target.closest('.card');
 if(card)playCard(card);
});

/* vyhodnotenie */
var PRAISE=['Výborne!','Super!','Správne!','Skvelé!','Tu si to!'];
function evaluate(card){
 var L=card.dataset.letter;
 if(L===S.cur.l)onGood(card);else onBad(card);
}
function showSmiley(){els.smiley.querySelector('span').textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];els.smiley.classList.remove('off');els.smiley.classList.add('on');clearTimeout(S.sm);S.sm=setTimeout(function(){els.smiley.classList.remove('on');els.smiley.classList.add('off')},1250)}
function onGood(card){
 S.locked=true;
 card.classList.add('gone');
 setZone('good',S.cur.l);
 els.word.textContent=S.cur.w;els.word.className='show ok';
 showSmiley();chime();
 S.idx++;
 clearTimeout(S.timer);
 S.timer=setTimeout(function(){if(S.idx>=PER_ROUND)endRound();else showQuestion()},1350);
}
function onBad(card){
 S.locked=true;buzz();card.classList.add('badflash');
 els.word.textContent=S.cur.w;els.word.className='show';
 setZone('bad','?');
 setTimeout(function(){
  card.classList.remove('fly');
  card.style.transition='transform .3s ease';
  card.style.transform='';
  setTimeout(function(){
   card.style.transition='';card.classList.add('shake');
   setTimeout(function(){card.classList.remove('shake');card.classList.add('gone');setZone('','?');S.locked=false},400);
  },320);
 },100);
}

/* kola a batéria */
function lightCell(i){var c=document.getElementById('cell'+i);if(c){c.classList.add('lit','pop');setTimeout(function(){c.classList.remove('pop')},600)}els.battLbl.textContent=S.round+'/'+ROUNDS}
function endRound(){
 lightCell(S.round-1);
 if(S.round>=ROUNDS){finale();return}
 starRain(2400,false);
 S.timer=setTimeout(function(){
  showDialog('Kolo '+S.round+' hotové! 🌟','Pokračuješ ďalej?','Pokračovať',function(){S.round++;S.idx=0;showQuestion()});
 },2500);
}
function finale(){
 starRain(2000,false);
 S.timer=setTimeout(function(){
  els.bulbG.classList.add('bulb-on','wob');
  setTimeout(function(){els.bulbG.classList.remove('wob');burstAtBulb();chime()},1000);
  S.timer=setTimeout(function(){showDialog('🎉 Hotovo! 🎉','Rozsvietil si žiarovku! Zvládol si všetkých 8 kôl.','Nová hra',function(){newGame()});starRain(6000,true)},2400);
 },2100);
}
function burstAtBulb(){var r=els.bulbG.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2)}
function showDialog(t,x,btn,cb){els.dTitle.textContent=t;els.dText.textContent=x;els.dBtn.textContent=btn;els.overlay.classList.add('show');els.dBtn.onclick=function(){hideDialog();if(cb)cb()}}
function hideDialog(){els.overlay.classList.remove('show')}

function newGame(){
 clearTimeout(S.timer);clearTimeout(S.sm);hideDialog();
 S.round=1;S.idx=0;S.bag=[];S.last=null;S.locked=false;
 for(var i=0;i<ROUNDS;i++){var c=document.getElementById('cell'+i);if(c)c.classList.remove('lit','pop')}
 els.bulbG.classList.remove('bulb-on','wob');
 els.battLbl.textContent='0/'+ROUNDS;
 showQuestion();
}
$('#newBtn').addEventListener('click',function(){newGame()});

/* efekty: hviezdy a iskry */
var fxc=$('#fx'),fxx=fxc.getContext('2d'),parts=[],spawning=false,fxRAF=0;
function fxSize(){fxc.width=window.innerWidth;fxc.height=window.innerHeight}
window.addEventListener('resize',fxSize);fxSize();
var STAR_COLORS=['#FFC107','#FFD54F','#FFFFFF','#FF8A65','#4FC3F7','#BA68C8'];
function addP(x,y,vx,vy,size,color,life,shape){parts.push({x:x,y:y,vx:vx,vy:vy,size:size,color:color,life:life,age:0,rot:Math.random()*6.28,vr:(Math.random()-.5)*.25,shape:shape})}
function starRain(dur,celebrate){
 if(spawning)return;
 spawning=true;var t0=Date.now();
 (function sp(){
  if(!spawning)return;
  if(Date.now()-t0>dur){spawning=false;return}
  for(var i=0;i<3;i++)addP(Math.random()*fxc.width,-20,(Math.random()-.5)*1.5,2+Math.random()*3.5,7+Math.random()*9,STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)],4000,(celebrate&&Math.random()<.45)?'rect':'star');
  setTimeout(sp,50);
 })();
 if(!fxRAF)fxLoop();
}
function burst(x,y){
 for(var i=0;i<54;i++){var a=Math.random()*6.283,v=2+Math.random()*7;addP(x,y,Math.cos(a)*v,Math.sin(a)*v-2,5+Math.random()*8,STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)],1200,'spark')}
 if(!fxRAF)fxLoop();
}
function fxLoop(){
 fxRAF=requestAnimationFrame(fxLoop);
 fxx.clearRect(0,0,fxc.width,fxc.height);
 for(var i=parts.length-1;i>=0;i--){
  var p=parts[i];p.age+=16;
  if(p.age>p.life||p.y>fxc.height+40){parts.splice(i,1);continue}
  p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
  if(p.shape==='spark'){p.vy+=.12;p.vx*=.985;p.vy*=.985}
  fxx.save();fxx.translate(p.x,p.y);fxx.rotate(p.rot);
  fxx.globalAlpha=Math.max(0,1-p.age/p.life);fxx.fillStyle=p.color;
  if(p.shape==='rect'){fxx.fillRect(-p.size/2,-p.size*.7,p.size,p.size*1.4)}
  else drawStar(p.size);
  fxx.restore();
 }
 if(!parts.length&&!spawning){cancelAnimationFrame(fxRAF);fxRAF=0;fxx.clearRect(0,0,fxc.width,fxc.height)}
}
function drawStar(r){
 fxx.beginPath();
 for(var i=0;i<10;i++){var rad=i%2?r*.45:r,a=Math.PI/5*i-Math.PI/2,x=Math.cos(a)*rad,y=Math.sin(a)*rad;if(i)fxx.lineTo(x,y);else fxx.moveTo(x,y)}
 fxx.closePath();fxx.fill();
}

/* zvuk (WebAudio, bez súborov) */
var AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,at,dur,type,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,at);g.gain.linearRampToValueAtTime(vol,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(a.destination);o.start(at);o.stop(at+dur+.05)}
function chime(){var a=ac();if(!a)return;var t=a.currentTime;tone(660,t,.15,'sine',.18);tone(880,t+.12,.15,'sine',.18);tone(1320,t+.24,.3,'sine',.18)}
function buzz(){var a=ac();if(!a)return;var t=a.currentTime;tone(150,t,.25,'sawtooth',.1);tone(110,t+.06,.3,'sawtooth',.09)}

/* ============ selftest ============ */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function tapTo(letter){
 var card=null;
 $$('.card').forEach(function(c){if(c.dataset.letter===letter&&!c.classList.contains('gone'))card=c});
 if(!card)return Promise.resolve(false);
 card.click();
 return Promise.resolve(true);
}
function selftest(){
 var lines=[];
 var ok=function(n,c){lines.push((c?'PASS':'FAIL')+': '+n)};
 ok('total words 139',ALL.length===139);
 var noArt=ALL.filter(function(o){return !ART[o.w]});
 ok('no missing art ('+noArt.join(',')+')',noArt.length===0);
 var badArt=ALL.filter(function(o){return ART[o.w]&&/NaN|undefined/.test(ART[o.w])});
 ok('no bad art ('+badArt.join(',')+')',badArt.length===0);
 var badL=ALL.filter(function(o){return o.w[0].toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')!==o.l.toLowerCase()});
 ok('letters ok ('+badL.map(function(o){return o.w}).join(',')+')',badL.length===0);
 var parseBad=0;
 ALL.forEach(function(o){var d=document.createElement('div');d.innerHTML=artOf(o.w);var s=d.querySelector('svg');if(!s||s.childElementCount<1||s.viewBox.baseVal.width!==200)parseBad++});
 ok('svg parse ('+parseBad+')',parseBad===0);
 var seen={};refill();var cnt=0;
 for(var i=0;i<ALL.length;i++){if(!S.bag.length)refill();var w=S.bag.shift().w;if(!seen[w]){seen[w]=1;cnt++}}
 ok('queue 139 unique ('+cnt+')',cnt===139);
 var run=function(){return (async function(){
  newGame();await sleep(150);
  ok('5 cards shown',$$('.card').length===5&&$$('.card:not(.gone)').length===5);
  ok('word hidden initially',!els.word.classList.contains('show'));
  var wrongL=LETTERS.filter(function(l){return l!==S.cur.l})[0];
  await tapTo(wrongL);await sleep(1600);
  ok('wrong card gone',$$('.card.gone').length===1);
  ok('word shown after wrong',els.word.classList.contains('show')&&els.word.textContent===S.cur.w);
  ok('word not green on wrong',!els.word.classList.contains('ok'));
  var before=S.cur.w;
  await tapTo(S.cur.l);await sleep(2000);
  ok('advanced after correct',S.cur.w!==before);
  ok('cards full again',$$('.card:not(.gone)').length===5);
  for(var k=0;k<15;k++){await tapTo(S.cur.l);await sleep(2000)}
  await sleep(2700);
  ok('round overlay shown',els.overlay.classList.contains('show')&&els.dText.textContent.indexOf('Pokračuješ')>=0);
  ok('battery cell 1 lit',document.getElementById('cell0').classList.contains('lit'));
  els.dBtn.click();await sleep(250);
  ok('round 2 starts',S.round===2&&$$('.card:not(.gone)').length===5);
  S.round=ROUNDS;S.idx=PER_ROUND-1;showQuestion();await sleep(200);
  await tapTo(S.cur.l);await sleep(2000);
  await sleep(5400);
  ok('final dialog',els.overlay.classList.contains('show')&&els.dBtn.textContent==='Nová hra');
  els.dBtn.click();await sleep(300);
  ok('newGame reset',S.round===1&&!document.getElementById('cell0').classList.contains('lit')&&$$('.card:not(.gone)').length===5);
 })()};
 run().then(function(){
  var fails=lines.filter(function(l){return l.indexOf('FAIL')===0});
  document.title=fails.length?'SELFTEST-FAIL('+fails.length+')':'SELFTEST-OK';
  var pre=document.createElement('pre');pre.id='testout';pre.textContent='SELFTEST DONE\n'+lines.join('\n');
  document.body.appendChild(pre);
 });
}

/* ============ list všetkých obrázkov (kontrola vizuálu) ============ */
function sheetMode(page,words){
 var per=40;
 var list=(typeof words==='string'&&words)?ALL.filter(function(o){return words.split(',').indexOf(o.w)>=0}):ALL.slice(page*per,(page+1)*per);
 document.body.className='sheet';
 document.body.innerHTML='<div id="sheet">'+list.map(function(o){return '<div class="cellart">'+artOf(o.w)+'<b>'+o.w+' ('+o.l+')</b></div>'}).join('')+'</div>';
}

/* ============ start ============ */
(function(){
 var mh=location.hash||'';
 var sm=mh.match(/sheet=(\d+)/), wm=mh.match(/words=([^&]+)/);
 if(wm){sheetMode(0,decodeURIComponent(wm[1]));return}
 if(sm){sheetMode(+sm[1]);return}
 newGame();
 if(mh.indexOf('selftest')>=0)setTimeout(selftest,300);
 var dm=mh.match(/demo=(\w+)/);
 if(dm){setTimeout(function(){
  var k=dm[1];
  if(k==='good'){var c=$$('.card').filter(function(x){return x.dataset.letter===S.cur.l})[0];if(c)onGood(c)}
  else if(k==='wrong'){var c2=$$('.card').filter(function(x){return x.dataset.letter!==S.cur.l})[0];if(c2)onBad(c2)}
  else if(k==='drag'){var c3=$$('.card')[0];playCard(c3)}
 },400)}
})();
window.__game={S:S,newGame:newGame,showQuestion:showQuestion,ALL:ALL,ART:ART,GROUPS:GROUPS,tapTo:tapTo,evaluate:evaluate,endRound:endRound};
</script>
